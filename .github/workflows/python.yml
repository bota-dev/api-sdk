name: Python API SDK qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  canonical:
    name: Build canonical wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install canonical normal CPython
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.15'
          architecture: x64
          freethreaded: false
      - name: Qualify repeated builds and fresh offline consumers
        env:
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON_EXE" -I -B packages/python/tools/ci.py \
            --expected-python 3.12.15 --output-dir "$RUNNER_TEMP/python-sdk-qualification" --fetch
      - name: Preserve the one canonical candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdk-canonical-${{ github.sha }}
          path: ${{ runner.temp }}/python-sdk-qualification/artifacts/*
          if-no-files-found: error
          retention-days: 7

  consumers:
    name: Same candidate on ${{ matrix.os }} / CPython ${{ matrix.python }}
    needs: canonical
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.12.15' }
          - { os: ubuntu-24.04, python: '3.13.16' }
          - { os: ubuntu-24.04, python: '3.14.8' }
          - { os: ubuntu-24.04, python: '3.15.0' }
          - { os: windows-2025, python: '3.13.16' }
          - { os: windows-2025, python: '3.14.8' }
          - { os: windows-2025, python: '3.15.0' }
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact normal CPython
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          freethreaded: false
      - name: Download only this run's canonical candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-sdk-canonical-${{ github.sha }}
          path: ${{ runner.temp }}/canonical-python-sdk
          digest-mismatch: error
      - name: Qualify source and the same offline wheel and sdist
        env:
          PYTHON_EXE: ${{ steps.python.outputs.python-path }}
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          "$PYTHON_EXE" -I -B packages/python/tools/ci.py \
            --expected-python "$EXPECTED_PYTHON" --output-dir "$RUNNER_TEMP/python-sdk-qualification" --fetch \
            --candidate-dir "$RUNNER_TEMP/canonical-python-sdk" \
            --candidate-receipt "$RUNNER_TEMP/canonical-python-sdk/qualification-receipt.json"
      - name: Preserve exact-runtime qualification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdk-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: ${{ runner.temp }}/python-sdk-qualification/artifacts/*
          if-no-files-found: error
          retention-days: 7
